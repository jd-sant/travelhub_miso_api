services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: travelhub
      POSTGRES_USER: travelhub_user
      POSTGRES_PASSWORD: travelhub_pass
    ports:
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql

        properties:
          build:
            context: ./services/properties
      interval: 5s
      timeout: 5s
      retries: 5

  users:
    build:
      context: ./services/users
      PYTHONPATH: /app/src
      RDS_HOSTNAME: postgres
      RDS_USERNAME: travelhub_user
      RDS_PASSWORD: travelhub_pass
      RDS_DB_NAME: travelhub
      RDS_PORT: "5432"
      DB_SCHEMA: users_schema
      DB_ECHO: "False"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:

  security:
    build:
      context: ./services/security
    environment:

        properties:
          build:
            context: ./services/properties
          environment:
            PYTHONPATH: /app/src
            RDS_HOSTNAME: postgres
            RDS_USERNAME: travelhub_user
            RDS_PASSWORD: travelhub_pass
            RDS_DB_NAME: travelhub
            RDS_PORT: "5432"
            DB_SCHEMA: properties_schema
            DB_ECHO: "False"
          ports:
            - "8005:8000"
          depends_on:
            postgres:
              condition: service_healthy
      PYTHONPATH: /app/src
      RDS_HOSTNAME: postgres
      RDS_USERNAME: travelhub_user
      DB_ECHO: "False"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      USERS_SERVICE_URL: http://users:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@travelhub.com}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started

  reservations:
    build:
      context: ./services/reservations
    environment:
      PYTHONPATH: /app/src
      ENV: ${ENV:-development}
      APP_ENV: ${APP_ENV:-development}
      RESERVATION_SCHEDULER_ENABLED: ${RESERVATION_SCHEDULER_ENABLED:-false}
      RESERVATION_SCHEDULER_DELAY_MINUTES: ${RESERVATION_SCHEDULER_DELAY_MINUTES:-15}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      LAMBDA_ARN: ${LAMBDA_ARN:-}
      SCHEDULER_ROLE_ARN: ${SCHEDULER_ROLE_ARN:-}
      API_BASE_URL: ${API_BASE_URL:-}
      RDS_HOSTNAME: postgres
      RDS_USERNAME: travelhub_user
      RDS_PASSWORD: travelhub_pass
      RDS_DB_NAME: travelhub
      RDS_PORT: "5432"
      DB_SCHEMA: reservations_schema
      DB_ECHO: "False"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  payments:
    build:
      context: ./services/payments
    environment:
      PYTHONPATH: /app/src
      RDS_HOSTNAME: postgres
      RDS_USERNAME: travelhub_user
      RDS_PASSWORD: travelhub_pass
      RDS_DB_NAME: travelhub
      RDS_PORT: "5432"
      DB_SCHEMA: payments_schema
      DB_ECHO: "False"
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake_stripe}
      PAYMENTS_COMPLIANCE_MODE: ${PAYMENTS_COMPLIANCE_MODE:-false}
      PAYMENT_DUPLICATE_WINDOW_SECONDS: "2"
      ENFORCE_TLS_HEADER: "True"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PAYMENT_INTEGRITY_SECRET: ${PAYMENT_INTEGRITY_SECRET}
      PAYMENTS_DATA_ENCRYPTION_KEY: ${PAYMENTS_DATA_ENCRYPTION_KEY:-dev-payments-encryption-key-change-me}
      NOTIFICATIONS_SERVICE_URL: http://notifications:8000
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      ALLOWED_CORS_ORIGINS: ${ALLOWED_CORS_ORIGINS}
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy

  notifications:
    build:
      context: ./services/notifications
    environment:
      PYTHONPATH: /app/src
      RDS_HOSTNAME: postgres
      RDS_USERNAME: travelhub_user
      RDS_PASSWORD: travelhub_pass
      RDS_DB_NAME: travelhub
      RDS_PORT: "5432"
      DB_SCHEMA: notifications_schema
      DB_ECHO: "False"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PAYMENTS_SERVICE_URL: http://payments:8000
      USERS_SERVICE_URL: http://users:8000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@travelhub.com}
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy

  properties:
    build:
      context: ./services/properties
    environment:
      PYTHONPATH: /app/src
      RDS_HOSTNAME: postgres
      RDS_USERNAME: travelhub_user
      RDS_PASSWORD: travelhub_pass
      RDS_DB_NAME: travelhub
      RDS_PORT: "5432"
      DB_SCHEMA: properties_schema
      DB_ECHO: "False"
    ports:
      - "8005:8000"
    depends_on:
      postgres:
        condition: service_healthy

  search:
    build:
      context: ./services/search
    environment:
      PYTHONPATH: /app/src
      ENV: ${ENV:-development}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://travelhub_user:travelhub_pass@postgres:5432/travelhub
      DB_SCHEMA: search_schema
      DB_ECHO: "False"
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
