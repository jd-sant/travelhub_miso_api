[newrelic]
region = us
log_level = warning
monitor_mode = true
high_security = false

transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
transaction_tracer.record_sql = obfuscated
transaction_tracer.stack_trace_threshold = 1.0
transaction_tracer.explain_threshold = 2.0
transaction_tracer.top_n = 20

transaction_events.max_samples_stored = 1000
transaction_events.harvest_cycle = 60
span_events.max_samples_stored = 100
span_events.harvest_cycle = 60
custom_insights_events.max_samples_stored = 100
custom_insights_events.harvest_cycle = 60

error_collector.enabled = true
error_collector.capture_attributes = false

browser_monitoring.auto_instrument = false

instrumentation.monotonic.enabled = true
cross_application_tracer.enabled = false
distributed_tracing.enabled = true
span_events.enabled = true

attributes.enabled = false
transaction_events.attributes.enabled = false
transaction_tracer.attributes.enabled = false
span_events.attributes.enabled = false
error_collector.attributes.enabled = false

runtime_metrics.enabled = true
runtime_metrics.cpu_sampling_interval = 0.1
